<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ректификация BLE</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  
  <!-- Поддержка установки на iOS / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Колонка">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 15px; margin: 0; text-align: center; }
    
    .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .header h2 { margin: 0; }
    .ver-badge { font-size: 12px; background: #2a2a2a; color: #00e676; padding: 2px 8px; border-radius: 10px; border: 1px solid #00e67644; font-weight: bold; }
    
    .card { background: #1e1e1e; padding: 16px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .device-info { font-size: 14px; color: #aaa; margin-bottom: 10px; }
    .status { font-weight: bold; color: #ff5252; }
    .status.connected { color: #00e676; }
    .status.pending { color: #ffca28; }
    
    .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    button { background: #007bff; color: white; border: none; padding: 10px 18px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    button:active { opacity: 0.8; }
    button.btn-danger { background: #dc3545; }
    button.btn-secondary { background: #444; }
    button.btn-install { background: #28a745; width: 100%; margin-bottom: 15px; font-size: 16px; display: none; }
    button:disabled { background: #2a2a2a; color: #666; cursor: not-allowed; }

    .val { font-size: 26px; font-weight: bold; color: #00e676; margin-top: 4px; }
    .sw-info { font-size: 11px; color: #666; margin-top: -10px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Автоматика Ректификации</h2>
    <span class="ver-badge">v1.0.2</span>
  </div>

  <!-- Кнопка установки PWA -->
  <button id="btnInstallPWA" class="btn-install" onclick="installPWA()">📲 Установить приложение</button>
  <div id="swStatus" class="sw-info">SW: Проверка...</div>

  <!-- Блок управления BLE-устройством -->
  <div class="card">
    <div class="device-info">Устройство: <b id="deviceName">Не выбрано</b></div>
    <div>Статус: <span id="bleStatus" class="status">Отключено</span></div>
    
    <div class="btn-group">
      <button id="btnConnect" onclick="connectOrReconnect()">Подключиться</button>
      <button id="btnDisconnect" onclick="disconnectBLE()" style="display: none;" class="btn-danger">Отключить</button>
      <button id="btnSelectNew" onclick="selectNewDevice()" class="btn-secondary">Сменить устройство</button>
    </div>
  </div>

  <!-- Панель показателей -->
  <div class="card">
    <div>Температура куба: <div id="tempCube" class="val">-- °C</div></div>
    <hr style="border-color: #2c2c2c; margin: 15px 0;">
    <div>Мощность нагрева: <div id="pwr" class="val">-- Вт</div></div>
  </div>

  <!-- Управление -->
  <div class="card">
    <div class="btn-group">
      <button onclick="sendCmd('PWR:3800')">3.8 кВт</button>
      <button onclick="sendCmd('PWR:2000')">2.0 кВт</button>
      <button onclick="sendCmd('PWR:0')" class="btn-danger">Выключить ТЭН</button>
    </div>
  </div>

  <script src="app.js"></script>

  <!-- Регистрация Service Worker и обработка установки PWA -->
  <script>
    const swStatusEl = document.getElementById('swStatus');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => {
          console.log('[PWA] SW зарегистрирован:', reg.scope);
          swStatusEl.innerText = "SW: Активен";
        })
        .catch(err => {
          console.error('[PWA] Ошибка SW:', err);
          swStatusEl.innerText = "SW: Ошибка (" + err.message + ")";
        });
    } else {
      swStatusEl.innerText = "SW: Не поддерживается браузером";
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('btnInstallPWA');
      if (installBtn) installBtn.style.display = 'block';
    });

    async function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`[PWA] Ответ на установку: ${outcome}`);
      deferredPrompt = null;
      document.getElementById('btnInstallPWA').style.display = 'none';
    }
  </script>
</body>
</html>
